name: Build AOSP-su Windows x64

on:
  push:
    branches:
      - aosp-su
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            meson ninja-build nasm ffmpeg \
            libsdl2-2.0-0 libsdl2-dev \
            libavcodec-dev libavdevice-dev libavformat-dev \
            libavutil-dev libswresample-dev \
            libusb-1.0-0 libusb-1.0-0-dev \
            mingw-w64 mingw-w64-tools libz-mingw-w64-dev

      - name: Build scrcpy server
        env:
          GRADLE: gradle
          VERSION: aosp-su
        run: release/build_server.sh

      - name: Build Windows x64 client
        env:
          VERSION: aosp-su
        run: release/build_windows.sh 64

      - name: Assemble portable package
        run: |
          cp release/work/build-server/server/scrcpy-server \
             release/work/build-win64/dist/scrcpy-server
          test -f release/work/build-win64/dist/scrcpy.exe
          test -f release/work/build-win64/dist/scrcpy-server

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-aosp-su-win64
          path: release/work/build-win64/dist/
          if-no-files-found: error
